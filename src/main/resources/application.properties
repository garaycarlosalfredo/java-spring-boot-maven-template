spring.application.name=spring-boot-template

# TEMPLATE: Adapt configuration sources for the target environment.
spring.config.import=optional:file:.env[.properties]

# TEMPLATE: Set connection values through the selected environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# TEMPLATE: Decide the credential source and authentication mechanism of the derived project.
# Both values are required and have no default: the application fails to start when either
# is missing or blank. Supply them through the environment or the local .env; never commit them.
app.security.username=${APP_SECURITY_USERNAME}
app.security.password=${APP_SECURITY_PASSWORD}

# Schema changes belong to versioned Flyway migrations.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# TEMPLATE: Expose only the management endpoints required by the deployment.
management.endpoints.web.exposure.include=health

# TEMPLATE: Keep probe behavior aligned with the target platform's liveness and readiness model.
management.endpoint.health.probes.enabled=true
# TEMPLATE: Include dependencies needed to serve traffic in readiness; keep liveness independent.
management.endpoint.health.group.readiness.include=readinessState,db
# TEMPLATE: Choose a health detail policy for the deployment; never expose secrets or connection data.
management.endpoint.health.show-details=never
# TEMPLATE: Consider a separate management port or network policy when deploying beyond local use.

